name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      SAGITTAIQ_TEST_ADMIN_CODE: 'ci-admin-synthetic-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run pages:check
      - name: Configure synthetic local admin integration tests
        run: node -e "require('fs').writeFileSync('.dev.vars', 'ADMIN_ACCESS_CODE=ci-admin-synthetic-only\nAPPLICATION_SYNC_SALT=ci-synthetic-only\n')"
      - run: npm run db:migrate
      - name: Verify migration reruns are safe
        run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run extension:package
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
